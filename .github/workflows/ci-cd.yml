name: Go CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  # ==========================================
  # CI
  # ==========================================

  ci:
    name: CI

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: library_management_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d library_management_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: |
          gofmt -w .

      - name: Vet
        run: |
          go vet ./internal...

      - name: Run migration
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/migrations:/migrations" \
            migrate/migrate \
            -path=/migrations \
            -database "postgres://postgres:root@localhost:5432/library_management_test?sslmode=disable" \
            up

      - name: Test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: root
          DB_NAME: library_management_test
          DB_SSLMODE: disable

        run: |
          go test ./... -count=1 -p 1

  # ==========================================
  # DOCKER BUILD & PUSH
  # ==========================================

  docker:
    name: Build & Push Docker Image

    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            --platform linux/amd64 \
            -f deployment/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ==========================================
  # DEPLOY
  # ==========================================

  deploy:
    name: Deploy to EC2

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare deployment files
        env:
          APP_PORT: ${{ secrets.APP_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}

        run: |
          cat > production.env <<EOF
          APP_PORT=$APP_PORT
          JWT_SECRET=$JWT_SECRET

          DB_HOST=$DB_HOST
          DB_PORT=$DB_PORT
          DB_USER=$DB_USER
          DB_PASSWORD=$DB_PASSWORD
          DB_NAME=$DB_NAME
          DB_SSLMODE=$DB_SSLMODE

          REDIS_HOST=$REDIS_HOST
          REDIS_PORT=$REDIS_PORT
          EOF

          base64 -w 0 production.env > production.env.b64
          base64 -w 0 deployment/docker-compose.prod.yaml > docker-compose.prod.yaml.b64

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          ENV_B64=$(cat production.env.b64)

          COMPOSE_B64=$(cat docker-compose.prod.yaml.b64)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="
              mkdir -p /opt/library-management &&
              echo '$ENV_B64' | base64 -d > /opt/library-management/.env &&
              echo '$COMPOSE_B64' | base64 -d > /opt/library-management/docker-compose.prod.yaml &&
              aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$ECR_REGISTRY' &&
              cd /opt/library-management &&
              export ECR_REGISTRY='$ECR_REGISTRY' &&
              export ECR_REPOSITORY='$ECR_REPOSITORY' &&
              export IMAGE_TAG='$IMAGE_TAG' &&
              docker compose --env-file .env -f docker-compose.prod.yaml pull &&
              docker compose --env-file .env -f docker-compose.prod.yaml up -d --remove-orphans &&
              docker image prune -f
            " \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"


          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"


          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
