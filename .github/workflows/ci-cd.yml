name: Go CI/CD to AWS ECR & EC2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ================= STAGE CI: TEST & BUILD IMAGE =================
  ci-process:
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: library_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d library_management_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26" # Sesuai Dockerfile dasar Anda sebelumnya

      - name: Run migration
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/migrations:/migrations \
            migrate/migrate \
            -path=/migrations \
            -database "postgres://postgres:root@localhost:5432/library_management_test?sslmode=disable" \
            up

      - name: Test
        run: go test -v ./internal... -count=1 -p 1

      # --- PROSES DOCKER BUILD & PUSH KE ECR ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Perhatikan flag platform untuk memastikan kecocokan arsitektur EC2
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ================= STAGE CD: DEPLOY TO EC2 =================
  cd-process:
    needs: ci-process
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy using Docker Compose
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Pastikan env file lokal di EC2 atau workspace memiliki nilai DB/Redis yang tepat
          # 2. Tarik image terbaru yang baru saja di-push ke ECR
          docker compose pull api

          # 3. Jalankan ulang container dengan downtime minimal (--remove-orphans opsional)
          docker compose up -d --remove-orphans
